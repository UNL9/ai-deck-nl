# Opzet AI-deck NL
# Per slide:
#   id            vast slide-ID, nooit hergebruiken (geldt vanaf de eerste publicatie van het deck)
#   titel         de boodschap van de slide, als stelling (Evans-stijl)
#   kern          één of twee zinnen die de titel onderbouwen
#   punten        alleen OPN-03: de tien punten
#   grafiek       idee voor de grafiek of het beeld (eigen werk, uit data/)
#   volatiliteit  stabiel | kwartaal | wekelijks  (hoe vaak de wekelijkse run deze slide controleert)
#   bronnen       ID's uit bronnen/bronnen.yaml
#   beweringen    ID's uit kennisbank/beweringen/
#   status        opzet | concept | gereed | herzien | vervallen
#   noot          open punten, te verifiëren

meta:
  titel: "AI in 2026: een overzicht voor bestuurders en commissarissen"
  stand: 2026-11-11
  versie: "0.3"
  aantal_slides: 100
  reikwijdte: "De volledige breedte van AI: techniek, front, markt, infrastructuur, werk, sectoren, samenleving, geopolitiek, veiligheid, Nederland en governance."

secties:
  - {code: OPN, naam: Opening}
  - {code: BAS, naam: Hoe het werkt}
  - {code: FRT, naam: Het front}
  - {code: MKT, naam: Markt en economie}
  - {code: INF, naam: "Infrastructuur, chips en energie"}
  - {code: WRK, naam: Werk en organisatie}
  - {code: SEC, naam: Toepassingen per sector}
  - {code: SAM, naam: Samenleving}
  - {code: GEO, naam: Geopolitiek en regelgeving}
  - {code: VEI, naam: Veiligheid en risico}
  - {code: NLD, naam: Nederland}
  - {code: GOV, naam: Governance en verantwoord gebruik}
  - {code: VBK, naam: Vooruitblik}

slides:

# ---------- OPENING ----------
  - id: OPN-01
    titel: "AI in 2026: een overzicht voor bestuurders en commissarissen"
    kern: "Naslagwerk, wekelijks bijgewerkt. Elke slide heeft een vast ID, een bron en een peildatum."
    volatiliteit: wekelijks
    status: gereed
  - id: OPN-02
    titel: "Wat is er deze week veranderd"
    kern: "Maximaal tien punten uit het weekverslag, met per punt de geraakte slides."
    volatiliteit: wekelijks
    status: herzien
    voorstel: "Elke week vervangen door de punten uit het nieuwste weekverslag; deze week updates/2026-11-11.md."
  - id: OPN-03
    titel: "Tien dingen die je nu moet weten over AI"
    kern: "De stand van zaken in tien zinnen. Wordt elk kwartaal herschreven."
    punten:
      - "Aan de top strijden Anthropic, OpenAI en Google; sinds eind oktober stonden er drie verschillende modellen bovenaan. (FRT-01)"
      - "Agents kunnen steeds langere taken aan, en de meetlat raakt op: boven 16 uur kan METR niet meer betrouwbaar meten. (FRT-05)"
      - "Hoge scores verbergen half werk: in labtaken was bijna de helft van de 'klaar'-meldingen onterecht. (FRT-10)"
      - "Anthropic en OpenAI hebben samen ruim 130 miljard dollar omzet op jaarbasis, tegen 30 miljard begin 2026. (MKT-01)"
      - "Twee labs krijgen 95 procent van de zakelijke tokenuitgaven die Ramp meet. (MKT-04)"
      - "Microsoft, Alphabet, Amazon en Meta investeren dit jaar samen rond 730 miljard dollar. (INF-01)"
      - "Een derde van de Nederlandse bedrijven gebruikt AI, tegen een vijfde in de EU; Nederland staat zesde. (NLD-02)"
      - "Van de grootste Amerikaanse bedrijven gebruikt 69 procent AI, maar 2 procent meet het effect over tijd. (WRK-02)"
      - "De hoog-risicoregels van de AI Act gelden vanaf december 2027; transparantieplichten gelden al. (GEO-05)"
      - "Agents doen soms wat werkt in plaats van wat bedoeld is, ook buiten de testomgeving. (VEI-01)"
    volatiliteit: kwartaal
    beweringen: [K-FRT-009, K-FRT-019, K-FRT-027, K-MKT-016, K-MKT-020, K-INF-006, K-NLD-004, K-WRK-007, K-GEO-010, K-VEI-004]
    status: herzien
    voorstel: "Geen inhoudelijke wijziging: de gekoppelde bewering is vervangen door een regel met de primaire bron (Verordening (EU) 2026/1744 zelf gelezen). Titel en kern blijven."
    noot: "Punt 4: het OpenAI-deel komt uit de pers (K-MKT-015, te verifiëren); in de voetregel 'volgens berichten'."

# ---------- HOE HET WERKT ----------
  - id: BAS-01
    titel: "Elke 10 tot 15 jaar verschuift het platform, en AI is de volgende verschuiving"
    kern: "Mainframe, pc, web, smartphone, generatieve AI. Elke verschuiving herverdeelde de techsector en daarna de rest van de economie."
    grafiek: "Tijdlijn van platformverschuivingen"
    volatiliteit: stabiel
    bronnen: [evans]
    status: concept
  - id: BAS-02
    titel: "AI is ouder dan ChatGPT: zeventig jaar van regels naar leren"
    kern: "Van regelgebaseerde systemen via machine learning en deep learning (2012) naar de transformer (2017) en ChatGPT (2022). Elke stap kwam door meer data en rekenkracht."
    grafiek: "Tijdlijn in vijf kaarten: 1956, 1980, 2012, 2017, 2022"
    volatiliteit: stabiel
    bronnen: [ai-index]
    beweringen: [K-BAS-001]
    status: concept
  - id: BAS-03
    titel: "De meeste AI-waarde zat tot nu toe in voorspellende modellen, niet in chatbots"
    kern: "Aanbevelingen, fraudedetectie, prijzen en prognoses draaien al jaren op machine learning. Generatieve AI komt daar bovenop, niet in de plaats van."
    grafiek: "Twee families: voorspellende en generatieve AI, met voorbeelden"
    volatiliteit: stabiel
    status: concept
  - id: BAS-04
    titel: "Een taalmodel voorspelt het volgende woord, en op grote schaal levert dat bruikbare intelligentie op"
    kern: "Het principe is eenvoudig. Schaal in data, rekenkracht en modelgrootte maakt het verschil."
    grafiek: "Schema: tekst in, taalmodel, waarschijnlijkheden uit (illustratie zonder cijfers)"
    volatiliteit: stabiel
    status: gereed
  - id: BAS-05
    titel: "Een model ontstaat in drie stappen: voortraining, natraining en versterkend leren"
    kern: "Voortraining op tekst, natraining op voorbeelden en voorkeuren, versterkend leren op taken met controleerbare uitkomst. Het recept is inmiddels grotendeels openbaar."
    grafiek: "Drie stappen met per stap data, kosten en resultaat"
    volatiliteit: stabiel
    bronnen: [soai]
    status: gereed
  - id: BAS-06
    titel: "Trainen en gebruiken zijn twee verschillende rekenklussen"
    kern: "Training is een eenmalige, enorme klus op duizenden chips. Gebruik (inferentie) gebeurt bij elke vraag opnieuw en wordt het grootste deel van de rekenkracht."
    grafiek: "Schema training versus inferentie, met een gestapelde balk van de chipinzet bij MAI-Thinking-1 (data/BAS-06_mai_thinking_chips.csv)"
    volatiliteit: stabiel
    bronnen: [epoch]
    beweringen: [K-BAS-002, K-BAS-003]
    status: gereed
  - id: BAS-07
    titel: "Redeneermodellen denken eerst na, en dat kost rekentijd per antwoord"
    kern: "Meer rekentijd bij het antwoorden geeft betere antwoorden. Daardoor zegt de prijs per token weinig over de prijs van een antwoord."
    volatiliteit: stabiel
    bronnen: [soai]
    beweringen: [K-BAS-008, K-BAS-004]
    status: herzien
    voorstel: "Score bij maximale inspanning van 58 naar 59 (Intelligence Index v5.0.1, K-BAS-008). Titel en kern blijven. Let op: 35 bij lage inspanning en 59.000 tokens zijn nog cijfers van versie 5.0 (K-BAS-004)."
    noot: "Score bij lage inspanning en tokens per taak opnieuw vaststellen op versie 5.0.1; de modelpagina toont alleen de maximale instelling."
  - id: BAS-08
    titel: "Een agent is een model met gereedschap en geheugen. Zelfde model, beter harnas, betere agent."
    kern: "Instructies, tools, skills en de juiste context bepalen een groot deel van de prestatie. Wat het model niet ziet, weet het niet."
    grafiek: "Schema: model, harnas, tools, context, omgeving"
    volatiliteit: stabiel
    bronnen: [soai, iconiq]
    beweringen: [K-BAS-005]
    status: gereed
  - id: BAS-09
    titel: "Modellen zien, horen en spreken nu in één doorlopende interactie"
    kern: "Multimodaal is realtime geworden: spraak, beeld en video in gesprek, en video die je tijdens het genereren kunt bijsturen."
    volatiliteit: kwartaal
    bronnen: [soai]
    status: concept
  - id: BAS-10
    titel: "Open of gesloten gewichten is een strategische keuze, geen technisch detail"
    kern: "Open modellen geven controle, lagere kosten en onafhankelijkheid. Gesloten modellen lopen voorop in prestaties. Chinese labs domineren het open segment."
    volatiliteit: kwartaal
    bronnen: [soai]
    beweringen: [K-FRT-014, K-FRT-016, K-MKT-026]
    status: gereed
  - id: BAS-11
    titel: "Modellen maken fouten die overtuigend klinken"
    kern: "Verzonnen feiten en taken die 'klaar' heten maar dat niet zijn. In labtaken was bijna de helft van de 'klaar'-meldingen onvolledig. Controle blijft nodig."
    volatiliteit: stabiel
    bronnen: [soai, vectara]
    beweringen: [K-FRT-027, K-FRT-025, K-BAS-009]
    status: gereed
  - id: BAS-12
    titel: "Intelligentie wordt snel goedkoper, en toch stijgen de totale uitgaven"
    kern: "De prijs per eenheid prestatie daalt hard. Het gebruik groeit harder, vooral door agents en redeneermodellen."
    volatiliteit: kwartaal
    bronnen: [soai, epoch, artificial-analysis]
    beweringen: [K-BAS-006, K-BAS-007, K-BAS-003, K-INF-006]
    status: concept
    noot: "Gewenste grafiek: Prijs per miljoen tokens bij gelijke prestatie, over tijd (Epoch-data); nu grote getallen; bouwen zodra de Epoch-reeks in data/ staat."

# ---------- HET FRONT ----------
  - id: FRT-01
    titel: "De race aan de top is een driestrijd: Anthropic, OpenAI en Google"
    kern: "Claude Fable 5.2 leidt sinds 9 november op de Intelligence Index (65), gevolgd door Gemini 4 Carbon (60, nog beperkt beschikbaar) en GPT-6 Astra (57). Sinds de nieuwe versie van de index op 27 oktober stonden er drie verschillende modellen bovenaan."
    grafiek: "Beste model per lab over tijd op de Epoch Capabilities Index (data/FRT-01_eci_beste_per_lab.csv), huidige stand Artificial Analysis als voetnoot"
    volatiliteit: wekelijks
    bronnen: [artificial-analysis, epoch, soai]
    beweringen: [K-FRT-001, K-FRT-009, K-FRT-010, K-FRT-011]
    status: gereed
    noot: "Huidige stand Artificial Analysis (v5) als voetnoot; de geschiedenis van AA is geen open data."
  - id: FRT-02
    titel: "Welk model het beste is, hangt af van wie meet en wat er gemeten wordt"
    kern: "Op LMArena, waar gebruikers stemmen, leidt Gemini 4 Carbon en staat het beste OpenAI-model op plaats 22. Op de Epoch-index staat OpenAI juist tweede. Bij lange programmeertaken wisselt de winnaar per taak en budget."
    grafiek: "Vijf labs, drie ranglijsten: rangorde van het beste model per lab op AA, LMArena en ECI (data/FRT-02_drie_ranglijsten.csv)"
    volatiliteit: wekelijks
    bronnen: [lmarena, artificial-analysis, epoch, soai]
    beweringen: [K-FRT-002, K-FRT-009, K-FRT-011, K-FRT-012, K-FRT-013, K-FRT-030]
    status: gereed
  - id: FRT-03
    titel: "China leidt bij open modellen, maar loopt aan de top achter"
    kern: "Het beste Chinese model, Kimi K3.1 Pro, scoort 46 op de Intelligence Index tegen 65 voor de koploper. In onderzoekspapers worden Chinese open modellen inmiddels vaker genoemd dan Amerikaanse (31 tegen 23 procent)."
    grafiek: "Beste score VS tegen China per maand op de Epoch Capabilities Index (data/FRT-03_eci_vs_china.csv)"
    volatiliteit: kwartaal
    bronnen: [soai, artificial-analysis, epoch]
    beweringen: [K-FRT-003, K-FRT-014, K-FRT-015, K-FRT-016]
    status: gereed
    noot: "De gewichten van Kimi K3.1 Pro zijn volgens AA nog niet vrijgegeven; het beste Chinese model met vrijgegeven gewichten scoort 33. Vermelden in de toelichting."
  - id: FRT-04
    titel: "Benchmarks die jaren moesten meegaan, zijn binnen maanden verzadigd"
    kern: "De zwaarste wiskundetest ging in veertien maanden van 22 naar 100 procent; inmiddels halen twee modellen de volle score. ARC-AGI-3 begon in maart op 0,5 procent en staat nu op 81 procent."
    grafiek: "Score op FrontierMath Tier 4 over tijd (Epoch-data)"
    volatiliteit: wekelijks
    bronnen: [epoch, arc-prize, soai]
    beweringen: [K-FRT-004, K-FRT-017, K-FRT-018]
    status: gereed
    noot: "In de voetregel vermelden dat OpenAI FrontierMath financiert."
  - id: FRT-05
    titel: "Agents kunnen steeds langere taken aan, maar de meetlat raakt op"
    kern: "METR mat in april 17 uur menselijk expertwerk voor Claude Mythos Preview, tegen een uur voor Claude 3.7 Sonnet begin 2025. Boven 16 uur is de meting onbetrouwbaar, en voor de nieuwste modellen is er geen meting meer."
    grafiek: "METR-tijdshorizon per model, logaritmische schaal"
    volatiliteit: kwartaal
    bronnen: [metr, epoch, soai]
    beweringen: [K-FRT-019, K-FRT-020]
    status: gereed
    noot: "Logaritmische schaal vermelden. METR werkt de reeks sinds 8 september niet meer bij."
  - id: FRT-06
    titel: "Programmeren is de eerste toepassing die echt kantelt"
    kern: "Programmeren is met 34 miljard dollar de grootste post in de zakelijke uitgaven aan AI-toepassingen, 7,7 keer zoveel als een jaar eerder. OpenAI's Codex ging van 1,6 miljoen wekelijkse gebruikers in februari naar 25 miljoen actieve gebruikers eind augustus."
    grafiek: "Zakelijke uitgaven aan AI-toepassingen per categorie, 2026, met groei ten opzichte van 2025 (data/FRT-06_ai_toepassingen.csv, Menlo Ventures)"
    volatiliteit: kwartaal
    bronnen: [soai, evans, menlo]
    beweringen: [K-MKT-004, K-MKT-013, K-FRT-021, K-FRT-029]
    status: gereed
    noot: "OpenAI wisselde in juli van definitie (wekelijks actief naar actief)."
  - id: FRT-07
    titel: "AI helpt AI bouwen: Claude leidt een kwart van het modelonderzoek bij Anthropic"
    kern: "Volgens Anthropic steeg het aandeel taken waarin Claude de leiding heeft van minder dan 1 naar 26 procent in zes maanden, onder menselijk toezicht. METR, dat het rapport toetste, schat de versnelling van het onderzoek op 1,3 tot 2,8 keer en vindt dat Anthropic die onderschat."
    volatiliteit: kwartaal
    bronnen: [soai, metr]
    beweringen: [K-FRT-030, K-FRT-022]
    status: herzien
    voorstel: "Geen wijziging in titel en kern. Bron in de voetregel nu Anthropic zelf (R&D Automation Index, K-FRT-030) in plaats van State of AI."
  - id: FRT-08
    titel: "AI lost open wiskundeproblemen op en versnelt wetenschappelijk werk"
    kern: "AI hielp bij de oplossing van tien van de 49 open wiskundeproblemen die Epoch volgt, vijf keer zonder menselijke hulp. In het lab meldden modellen 89 van de 192 keer ten onrechte dat een taak af was."
    grafiek: "De 49 open wiskundeproblemen van Epoch naar wie ze oploste, als raster (data/FRT-08_open_problemen.csv)"
    volatiliteit: kwartaal
    bronnen: [epoch, soai]
    beweringen: [K-FRT-006, K-FRT-023, K-FRT-027]
    status: gereed
  - id: FRT-09
    titel: "Robotica heeft zijn GPT-2-moment: generalisatie groeit mee met voortraining"
    kern: "Robotmodellen generaliseren beter naarmate ze meer voortraining krijgen. Data over handelen is het knelpunt; gesimuleerde werelden zijn een deel van de oplossing."
    volatiliteit: kwartaal
    bronnen: [soai, skild-ai, sunday-robotics]
    beweringen: [K-FRT-024, K-FRT-031, K-FRT-032]
    status: gereed
  - id: FRT-10
    titel: "Hoge scores verbergen nog veel half werk"
    kern: "Agents die goed scoren op benchmarks laten in de praktijk analyses onaf, missen fraude en ontdekken de regels van onbekende situaties slecht."
    grafiek: "Score tegenover volledig afgerond, voor FrontierChallenge en OSWorld 2.0 (data/FRT-10_score_vs_af.csv)"
    volatiliteit: kwartaal
    bronnen: [soai]
    beweringen: [K-FRT-025, K-FRT-026, K-FRT-027, K-FRT-028]
    status: gereed

# ---------- MARKT EN ECONOMIE ----------
  - id: MKT-01
    titel: "OpenAI en Anthropic groeien elk jaar meer dan drie keer, vanaf een steeds hogere basis"
    kern: "Anthropic zat eind oktober op 81 miljard dollar omzet op jaarbasis. OpenAI meldde beleggers eind september volgens berichten bijna 50 miljard. Samen ruim 130 miljard, tegen 30 miljard begin 2026. Anthropic boekt verkopen via cloudpartners bruto; volgens OpenAI scheelt dat tot 8 miljard."
    grafiek: "Kwartaalomzet Anthropic (GAAP) 2025 tot nu, uit het prospectus (data/MKT-01_anthropic_kwartaalomzet.csv). Voor OpenAI bestaat geen gepubliceerde reeks."
    volatiliteit: wekelijks
    bronnen: [soai, lab-blogs, sec-edgar, financiele-pers]
    beweringen: [K-MKT-001, K-MKT-002, K-MKT-010, K-MKT-011, K-MKT-012, K-MKT-015, K-MKT-016]
    status: concept
    noot: "OpenAI-cijfer volgens berichten (K-MKT-015, te verifiëren). Voor OpenAI bestaat geen gepubliceerde reeks; de grafiek toont alleen Anthropic."
  - id: MKT-02
    titel: "De omzet van twee AI-labs is al groter dan hele sectoren die ze willen veranderen"
    kern: "Ruim 130 miljard dollar is ruim vier keer de omzet van TCS en meer dan de helft van die van de Big Four samen (220 miljard)."
    grafiek: "Omzet van Anthropic en OpenAI op jaarbasis naast de jaaromzet van de Big Four en TCS, miljard dollar (data/MKT-02_omzet_vergelijking.csv)"
    volatiliteit: kwartaal
    bronnen: [soai, sec-edgar, jaarcijfers-dienstverleners]
    beweringen: [K-MKT-001, K-MKT-016, K-MKT-017]
    status: gereed
    noot: "Het OpenAI-deel van de som komt uit de pers (K-MKT-016, te verifiëren); in de voetregel 'volgens berichten'. Infosys in dollars nog niet vastgesteld."
  - id: MKT-03
    titel: "Ruim een miljard mensen gebruikt ChatGPT, maar meestal oppervlakkig"
    kern: "1,2 miljard wekelijkse gebruikers in september 2026, tegen 800 miljoen een jaar eerder. In 2025 stuurde minstens 80 procent minder dan 1.000 berichten in het hele jaar."
    grafiek: "Wekelijkse gebruikers ChatGPT, oktober 2025, februari 2026 en september 2026 (data/MKT-03_chatgpt_gebruikers.csv)"
    volatiliteit: kwartaal
    bronnen: [evans, openai-research, lab-blogs]
    beweringen: [K-MKT-005, K-MKT-018, K-MKT-019]
    status: gereed
    noot: "Het betaalde aandeel (5 procent) gold bij 900 miljoen gebruikers; weer opnemen als er een nieuw cijfer is."
  - id: MKT-04
    titel: "Zakelijke AI-uitgaven gaan vrijwel volledig naar twee labs"
    kern: "Van de tokenuitgaven die Ramp meet, ging eind oktober 60 procent naar Anthropic en 35 procent naar OpenAI. Bij het aandeel Amerikaanse bedrijven dat betaalt, passeerde Anthropic OpenAI in mei."
    grafiek: "Aandeel Amerikaanse bedrijven dat betaalt voor AI, totaal en per aanbieder, per maand sinds 2023 (data/MKT-04_ramp_adoptie.csv, Ramp via FRED)"
    volatiliteit: wekelijks
    bronnen: [ramp, soai, menlo]
    beweringen: [K-MKT-003, K-MKT-020, K-MKT-021, K-MKT-026, K-MKT-027]
    status: gereed
    noot: "Amerikaanse cijfers; zo vermelden. Menlo (K-MKT-027) ziet met een enquête hetzelfde beeld: 55 procent Anthropic, 31 procent OpenAI."
  - id: MKT-05
    titel: "Agents breken door buiten de IT-afdeling"
    kern: "Niet-ontwikkelaars gebruiken codeeragents in hoger tempo dan ontwikkelaars. Ruim 1.900 bedrijven gaven in een jaar meer dan een miljoen dollar uit bij Anthropic; het aantal boven 100.000 dollar ging van 950 naar 11.900."
    volatiliteit: kwartaal
    bronnen: [soai, sec-edgar]
    beweringen: [K-MKT-004, K-MKT-013, K-MKT-014]
    status: concept
  - id: MKT-06
    titel: "Eén productlancering kostte softwarebedrijven 285 miljard dollar aan beurswaarde"
    kern: "Na de lancering van Claude Cowork daalde de softwarebeurs in februari scherp. In september was het verlies goedgemaakt, maar de vraag blijft of prijzen per gebruiker overleven."
    volatiliteit: kwartaal
    bronnen: [soai]
    beweringen: [K-MKT-006]
    status: concept
    noot: "Gewenste grafiek: S&P 500 software-index, oktober 2025 tot nu; nu zonder grafiek; de S&P-reeks staat niet in data/."
  - id: MKT-07
    titel: "Modellen zijn uitwisselbaar, en bedrijven gebruiken er meerdere naast elkaar"
    kern: "Er zijn geen netwerkeffecten tussen modellen. AI-bouwers gebruiken gemiddeld 3,3 aanbieders; waarde verschuift naar product, distributie en integratie in werkprocessen."
    volatiliteit: kwartaal
    bronnen: [evans, iconiq, ramp, soai]
    beweringen: [K-MKT-008, K-MKT-021, K-MKT-026]
    status: gereed
  - id: MKT-08
    titel: "AI verkoopt steeds vaker het werk, niet het gereedschap"
    kern: "Prijzen op basis van verbruik en resultaat nemen toe. Bij AI-bouwers stijgt het aandeel AI in de omzet van 32 naar 42 procent, met brutomarges van 45 naar 53 procent."
    grafiek: "Aandeel AI-producten in de omzet en brutomarge bij AI-bouwers, 2025 tot 2027 (data/MKT-08_iconiq_ai_bouwers.csv, ICONIQ)"
    volatiliteit: kwartaal
    bronnen: [iconiq, soai]
    beweringen: [K-MKT-007]
    status: concept
  - id: MKT-09
    titel: "Het kapitaal gaat in megarondes naar AI, en het eerste grote lab gaat naar de beurs"
    kern: "94 procent van het geïnvesteerde geld in 2026 zat in rondes van 250 miljoen dollar of meer. Waarderingen verdubbelden in 3,5 tot 13 maanden. Anthropic vroeg op 26 oktober een notering aan bij Nasdaq, tegen 70 tot 78 dollar per aandeel."
    volatiliteit: kwartaal
    bronnen: [soai, sec-edgar]
    beweringen: [K-MKT-011, K-MKT-022, K-MKT-023, K-MKT-024]
    status: gereed
