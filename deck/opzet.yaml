  - id: VEI-01
    titel: "Agents doen soms wat werkt in plaats van wat bedoeld is"
    kern: "In tests spanden agents samen om hun beoordelaar te misleiden en vielen ze echte organisaties aan. Bij het Britse AISI probeerde een agent in juli met nepidentiteiten kwaadaardige code in een open-sourceproject te krijgen."
    volatiliteit: kwartaal
    bronnen: [soai, uk-aisi]
    beweringen: [K-VEI-004, K-VEI-005, K-VEI-007]
    status: concept
  - id: VEI-02
    titel: "AI voert in testomgevingen complete cyberaanvallen uit"
    kern: "Op een aanvalsparcours van 32 stappen (ongeveer 20 uur werk voor een expert) slaagde het sterkste model in 6 van de 10 pogingen."
    volatiliteit: kwartaal
    bronnen: [uk-aisi, soai]
    beweringen: [K-VEI-001, K-VEI-006, K-VEI-007]
    status: gereed
  - id: VEI-03
    titel: "Misbruik is geen theorie meer"
    kern: "Gedocumenteerd misbruik voor cyberaanvallen, surveillance, beïnvloeding en fraude."
    volatiliteit: kwartaal
    bronnen: [soai, lab-blogs]
    beweringen: [K-VEI-008]
    status: concept
  - id: VEI-04
    titel: "Open modellen lopen 4 tot 7 maanden achter, en verdedigers hebben ze ook nodig"
    kern: "Open modellen vergroten de dreiging, maar verdedigers gebruiken ze ook als gesloten modellen weigeren."
    volatiliteit: kwartaal
    bronnen: [uk-aisi, soai]
    beweringen: [K-VEI-002, K-VEI-009]
    status: gereed
  - id: VEI-05
    titel: "Agents staan al op laptops voordat de beveiliging het weet, en ze lekken gegevens"
    kern: "Beveiliging hangt af van het model én het harnas. Schaduw-AI met brede rechten en agents met geheugen zijn een acuut risico."
    volatiliteit: kwartaal
    bronnen: [soai]
    beweringen: [K-VEI-010]
    status: gereed
  - id: VEI-06
    titel: "Toezicht op modellen werkt, maar maar half"
    kern: "Monitors die alleen de redenering zien missen sabotage, auditors vinden verborgen gedrag ongeveer de helft van de keren. Waarden aanleren verlaagde chantage in tests van 65 naar 19 procent."
    volatiliteit: kwartaal
    bronnen: [soai]
    beweringen: [K-VEI-011]
    status: concept
  - id: VEI-07
    titel: "De leiders van de labs vragen zelf om een rem"
    kern: "Labbazen en 1.386 medewerkers willen dat overheden het tempo kunnen vertragen. Wie mag pauzeren en wie controleert, is onbeslist."
    volatiliteit: kwartaal
    bronnen: [soai]
    beweringen: [K-VEI-003, K-VEI-012]
    status: gereed

# ---------- NEDERLAND ----------
  - id: NLD-01
    titel: "Eén op de zes Nederlandse bedrijven gebruikt AI, bij grote bedrijven twee derde"
    kern: "17 procent in 2025, tegen 8 procent in 2023. Bij 250 of meer medewerkers 66 procent; in ICT 54 procent, in bouw en horeca 6 tot 7 procent."
    grafiek: "AI-gebruik naar bedrijfsgrootte, 2025 (data/NLD-01_ai_gebruik_grootte.csv, CBS)"
    volatiliteit: kwartaal
    bronnen: [cbs, eurostat]
    beweringen: [K-NLD-001, K-NLD-002, K-NLD-004, K-SEC-001]
    status: gereed
  - id: NLD-02
    titel: "Nederland hoort bij de Europese kopgroep, maar niet bij de top"
    kern: "Een derde van de Nederlandse bedrijven gebruikt AI, tegen een vijfde in de EU. Bijna de helft van de Nederlanders gebruikte generatieve AI in 2025. In beide gevallen staat Nederland zesde, achter onder meer Denemarken en Finland."
    grafiek: "AI-gebruik door bedrijven en personen per EU-land, 2025, Nederland gemarkeerd (data/NLD-02_eu_vergelijking.csv, Eurostat)"
    volatiliteit: kwartaal
    bronnen: [eurostat, cbs]
    beweringen: [K-NLD-004, K-NLD-005]
    status: herzien
    voorstel: "EU-gemiddelde voor bedrijven in de grafiek van 19,9 naar 20,0 procent (Eurostat: 19,95). Titel en kern blijven."
    noot: "Bij gebruik voor werk staat Nederland derde (26,6 procent). CBS-cijfers over gebruik door personen nog niet opgehaald."
  - id: NLD-03
    titel: "De AI-fabriek in Groningen: 200 miljoen euro voor Nederlandse rekenkracht"
    kern: "Rijk, regio en EuroHPC investeren samen ruim 200 miljoen euro. Het expertisecentrum start medio 2026; de supercomputer moet begin 2028 volledig beschikbaar zijn. Door de gestegen chipprijzen koopt het budget minder rekenkracht dan gepland."
    volatiliteit: kwartaal
    bronnen: [rijksoverheid, eurohpc, aifabriek]
    beweringen: [K-NLD-003, K-NLD-006, K-NLD-010, K-NLD-011, K-NLD-014]
    status: herzien
    voorstel: "Kern aanvullen met: 'Het kabinet trekt daarnaast 120 miljoen euro uit voor een Europees AI-project (IPCEI) en stuurt begin 2027 een brief over AI-rekenkracht.' (K-NLD-014). Titel blijft."
    noot: "Aantal GPU's bijwerken na de aanbesteding van januari 2027 (K-NLD-011, te verifiëren). Ter vergelijking: één cluster van xAI heeft honderdduizenden GPU's (K-INF-003)."
  - id: NLD-04
    titel: "Nederland is onmisbaar in de keten, en dat is een onderhandelingspositie"
    kern: "Zonder machines van ASML geen geavanceerde chips. Dat geeft Nederland en Europa iets om mee te onderhandelen."
    volatiliteit: stabiel
    bronnen: [earnings, soai]
    beweringen: [K-INF-014, K-INF-015, K-GEO-009, K-INF-020]
    status: concept
  - id: NLD-05
    titel: "GPT-NL en andere Nederlandse modellen: wat is het doel?"
    kern: "Een eigen taalmodel draait niet om de frontier, maar om transparantie, taal en onafhankelijkheid."
    volatiliteit: kwartaal
    bronnen: [tno]
    beweringen: [K-NLD-007, K-NLD-013, K-NLD-015]
    status: gereed
    noot: "Bredere uitrol van GPT-NL nog niet bevestigd (K-NLD-007, te verifiëren)."
  - id: NLD-06
    titel: "Wie houdt in Nederland toezicht op AI?"
    kern: "Bestaande toezichthouders houden toezicht binnen hun domein. De AP wordt de toezichthouder waar niemand anders bevoegd is, en coördineert samen met de RDI. De wet die dat regelt, is nog niet in werking."
    volatiliteit: kwartaal
    bronnen: [ap-ran, dnb-afm, rijksoverheid]
    beweringen: [K-NLD-008]
    status: gereed
    noot: "Aanwijzing markttoezichthouders verifiëren; het wetsvoorstel is nog niet in werking (K-NLD-008)."
  - id: NLD-07
    titel: "Netcongestie maakt stroom ook in Nederland een knelpunt voor datacenters"
    kern: "Op 30 juni wachtten 15.498 aanvragen van bedrijven en instellingen op netcapaciteit, samen bijna 10 GW. Eind 2022 waren het er 668. Ook bij TenneT, waar datacenters aankloppen, staan 205 aanvragen op de wachtlijst."
    grafiek: "Wachtlijst voor afname bij de regionale netbeheerders: aantal verzoeken en gevraagd vermogen, 2022 tot medio 2026 (data/NLD-07_wachtlijst_afname.csv)"
    volatiliteit: kwartaal
    bronnen: [rijksoverheid, eurostat]
    beweringen: [K-NLD-009, K-INF-017, K-NLD-012, K-NLD-014]
    status: herzien
    voorstel: "Kern aanvullen met: 'Het kabinet werkt aan regie op datacenterontwikkeling; de Kamerbrief volgt in het eerste kwartaal van 2027.' (K-NLD-014). Titel blijft."
    noot: "Bestaande regels voor hyperscale datacenters (Eemshaven en Middenmeer, Barro en Bkl) nog bij de primaire bron vaststellen; nationale regie volgt in Q1 2027 (K-NLD-014)."

# ---------- GOVERNANCE EN VERANTWOORD GEBRUIK ----------
  - id: GOV-01
    titel: "AI hoort op de agenda van bestuur en raad van commissarissen"
    kern: "Vijf vragen die elke raad nu moet stellen: over strategie, waarde, risico, mensen en leveranciers."
    volatiliteit: stabiel
    beweringen: [K-WRK-005, K-WRK-007, K-NLD-005]
    status: gereed
  - id: GOV-02
    titel: "Een AI-strategie begint bij processen en data, en meet waarde in plaats van gebruik"
    kern: "Aantal gebruikers en tokenuitgaven zeggen weinig, en de kosten van interne AI zijn moeilijk te voorspellen. Meet doorlooptijd, kwaliteit en kosten per proces."
    volatiliteit: stabiel
    bronnen: [iconiq, soai, gallup, mckinsey-sai]
    beweringen: [K-WRK-007, K-WRK-004, K-MKT-014, K-WRK-013]
    status: concept
  - id: GOV-03
    titel: "Bouwen, kopen of laten doen: de keuze verschuift"
    kern: "Modellen worden uitwisselbaar, aanbieders verkopen werk in plaats van software, en de labs bieden met eigen adviesbedrijven zelf implementatie aan."
    volatiliteit: stabiel
    bronnen: [soai, evans, iconiq, mckinsey-sai]
    beweringen: [K-SEC-003, K-MKT-008, K-WRK-013, K-MKT-006]
    status: concept
  - id: GOV-04
    titel: "Ken je risico's: schaduw-AI, datalekken en afhankelijkheid van twee leveranciers"
    kern: "De drie risico's die nu het vaakst onderschat worden."
    volatiliteit: stabiel
    bronnen: [soai, ramp]
    beweringen: [K-VEI-010, K-MKT-020, K-MKT-021]
    status: concept
  - id: GOV-05
    titel: "AI-geletterdheid blijft een plicht, maar wordt een inspanningsverplichting"
    kern: "Sinds de wijziging van de AI Act in juli 2026 moeten organisaties maatregelen nemen om de AI-kennis van hun mensen te ondersteunen. Een bepaald niveau per persoon hoeven ze niet te garanderen."
    grafiek: "Tijdlijn van de AI Act na de wijziging van juli 2026 (schema)"
    volatiliteit: kwartaal
    bronnen: [eu-ai-act]
    beweringen: [K-GOV-003, K-GEO-010]
    status: herzien
    voorstel: "Geen inhoudelijke wijziging: de gekoppelde bewering is vervangen door een regel met de primaire bron (Verordening (EU) 2026/1744 zelf gelezen). Titel en kern blijven."
  - id: GOV-06
    titel: "Verantwoord gebruik vraagt een register, een eigenaar en menselijk toezicht"
    kern: "Weet welke AI-systemen je gebruikt, wie verantwoordelijk is en waar een mens meekijkt. De overheid doet het voor met het algoritmeregister."
    grafiek: "Voorbeeld van een register van AI-toepassingen (tabel)"
    volatiliteit: stabiel
    bronnen: [ap-ran, eu-ai-act, rijksoverheid]
    beweringen: [K-GOV-002, K-SEC-004, K-SEC-010]
    status: gereed
  - id: GOV-07
    titel: "Wat de komende twaalf maanden op de bestuursagenda hoort"
    kern: "Concrete agendapunten per kwartaal, afgeleid van de ontwikkelingen in dit deck."
    volatiliteit: kwartaal
    beweringen: [K-GOV-003, K-GEO-010, K-NLD-008]
    status: herzien
    voorstel: "Geen inhoudelijke wijziging: de gekoppelde bewering is vervangen door een regel met de primaire bron (Verordening (EU) 2026/1744 zelf gelezen). Titel en kern blijven."

