    beweringen: [K-NLD-003]
    status: opzet
    noot: "Huidige status en capaciteit verifiëren"
  - id: NLD-04
    titel: "Nederland is onmisbaar in de keten, en dat is een onderhandelingspositie"
    kern: "Zonder machines van ASML geen geavanceerde chips. Dat geeft Nederland en Europa iets om mee te onderhandelen."
    volatiliteit: stabiel
    bronnen: [earnings, soai]
    status: opzet
  - id: NLD-05
    titel: "GPT-NL en andere Nederlandse modellen: wat is het doel?"
    kern: "Een eigen taalmodel draait niet om de frontier, maar om transparantie, taal en onafhankelijkheid."
    volatiliteit: kwartaal
    bronnen: [tno]
    status: opzet
    noot: "Status GPT-NL verifiëren"
  - id: NLD-06
    titel: "Wie houdt in Nederland toezicht op AI?"
    kern: "De AP coördineert het toezicht op algoritmes. DNB en AFM kijken naar de financiële sector."
    volatiliteit: kwartaal
    bronnen: [ap-ran, dnb-afm]
    status: opzet
    noot: "Aanwijzing markttoezichthouders AI Act in Nederland verifiëren"
  - id: NLD-07
    titel: "Netcongestie maakt stroom ook in Nederland een knelpunt voor datacenters"
    kern: "Wachtlijsten voor netaansluitingen en beleid voor hyperscale datacenters bepalen waar rekenkracht kan komen."
    volatiliteit: kwartaal
    bronnen: [rijksoverheid]
    status: opzet
    noot: "Cijfers netbeheerders en datacenterbeleid ophalen"

# ---------- GOVERNANCE EN VERANTWOORD GEBRUIK ----------
  - id: GOV-01
    titel: "AI hoort op de agenda van bestuur en raad van commissarissen"
    kern: "Vijf vragen die elke raad nu moet stellen: over strategie, waarde, risico, mensen en leveranciers."
    volatiliteit: stabiel
    status: opzet
  - id: GOV-02
    titel: "Een AI-strategie begint bij processen en data, en meet waarde in plaats van gebruik"
    kern: "Aantal gebruikers en tokenuitgaven zeggen weinig, en de kosten van interne AI zijn moeilijk te voorspellen. Meet doorlooptijd, kwaliteit en kosten per proces."
    volatiliteit: stabiel
    bronnen: [iconiq]
    status: opzet
  - id: GOV-03
    titel: "Bouwen, kopen of laten doen: de keuze verschuift"
    kern: "Modellen worden uitwisselbaar, aanbieders verkopen werk in plaats van software, en de labs bieden met eigen adviesbedrijven zelf implementatie aan."
    volatiliteit: stabiel
    bronnen: [soai, evans]
    status: opzet
  - id: GOV-04
    titel: "Ken je risico's: schaduw-AI, datalekken en afhankelijkheid van twee leveranciers"
    kern: "De drie risico's die nu het vaakst onderschat worden."
    volatiliteit: stabiel
    status: opzet
  - id: GOV-05
    titel: "AI-geletterdheid is een wettelijke plicht"
    kern: "Artikel 4 van de AI Act verplicht organisaties die AI inzetten om te zorgen dat hun mensen er voldoende van weten."
    volatiliteit: kwartaal
    bronnen: [eu-ai-act]
    status: opzet
    noot: "Verifiëren of de Digital Omnibus deze plicht heeft gewijzigd"
  - id: GOV-06
    titel: "Verantwoord gebruik vraagt een register, een eigenaar en menselijk toezicht"
    kern: "Weet welke AI-systemen je gebruikt, wie verantwoordelijk is en waar een mens meekijkt. De overheid doet het voor met het algoritmeregister."
    volatiliteit: stabiel
    bronnen: [ap-ran, eu-ai-act]
    status: opzet
  - id: GOV-07
    titel: "Wat de komende twaalf maanden op de bestuursagenda hoort"
    kern: "Concrete agendapunten per kwartaal, afgeleid van de ontwikkelingen in dit deck."
    volatiliteit: kwartaal
    status: opzet

