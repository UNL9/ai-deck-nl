# VEI-05: agents op laptops
- id: K-VEI-010
  bewering: "De beveiliging van een agent hangt af van het model en de software eromheen: in HarnessSafe verschoof de score 23 punten door een andere omgeving en 36 punten door een ander model. De open-source agent OpenClaw kreeg 388.000 sterren op GitHub en stond bij bedrijven op laptops voordat er beleid voor was. GPT-5 lekte in een geheugentest 9,6% van de privégegevens in de verkeerde context."
  peildatum: 2026-09
  bron: soai
  vindplaats: "State of AI Report 2026, slides 203, 204 en 216"
