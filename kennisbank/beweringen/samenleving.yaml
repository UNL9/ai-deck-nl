  vervangen_door: K-SAM-008
  slides: [SAM-01]
  noot: "De wet is genoemd naar een tiener van wie de ouders stellen dat ChatGPT bijdroeg aan zijn zelfmoord; OpenAI ontkent dat. Wettekst zelf nog niet gecontroleerd. Gecontroleerd op 2026-11-11 bij de indiener (Senaat Californië): de limieten van een uur per sessie en twee uur per dag en de datum juli 2027 worden daar niet genoemd. Vervangen door K-SAM-008 (Californië) en K-SAM-009 (China, EU, VK)."

