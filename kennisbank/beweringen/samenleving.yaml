# SAM-01: AI als gezelschap
- id: K-SAM-001
  bewering: "Californië regelt met 'Adam's Law' hoe chatbots relaties met kinderen aangaan: standaard maximaal een uur per sessie en twee uur per dag, en waarborgen tegen romantische toenadering, vleierij en afhankelijkheid. De belangrijkste ontwerpregels gelden vanaf juli 2027. China verbiedt sinds juli 2026 virtuele intieme relaties voor minderjarigen; de EU verbiedt via de AI Act schadelijke manipulatie; het VK kondigde verplichte pauzes voor gebruikers onder 18 aan."
  peildatum: 2026-09
