  bewering: "Datacenters gebruikten wereldwijd circa 485 TWh stroom in 2025, 17% meer dan in 2024 (416 TWh). Datacenters voor AI gebruikten circa 155 TWh, een groei van ongeveer 50%. Het IEA verwacht circa 950 TWh in 2030, ongeveer 3% van het wereldwijde stroomverbruik."
