  status: actueel
  slides: [SEC-05, SAM-06, GOV-06]
  noot: "Bedragen uit de Kamerbrieven van het ministerie van Financiën. De FSV-boete bestaat uit zes delen van 250.000 tot 1 miljoen euro; twee van de drie boetes van 2021 zijn verhoogd omdat de verwerking discriminerend was. 'Hoogste tot dan toe' staat op de nieuwspagina van de AP (april 2022); die site geeft een 403 aan scripts en is via de zoekindex gelezen. De AP legde later hogere boetes op."
