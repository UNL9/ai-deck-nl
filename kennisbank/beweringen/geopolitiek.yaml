# ---------- Wekelijkse update 2026-11-11 ----------
- id: K-GEO-010
  bewering: "De Digitale omnibus inzake AI is Verordening (EU) 2026/1744 van 8 juli 2026 (standpunt Parlement 16 juni, besluit Raad 29 juni), bekendgemaakt op 24 juli 2026 en in werking op de derde dag daarna. Hoog-risicoverplichtingen gelden vanaf 2 december 2027 voor systemen uit bijlage III en vanaf 2 augustus 2028 voor systemen in producten uit bijlage I. Nieuwe verboden in artikel 5 (onder meer AI voor niet-consensuele intieme beelden) gelden vanaf 2 december 2026. Wie generatieve systemen al vóór 2 augustus 2026 op de markt had, moet uiterlijk 2 december 2026 aan de markeringsplicht van artikel 50, lid 2 voldoen."
  peildatum: 2026-07-24
  bron: eu-ai-act
  vindplaats: "Verordening (EU) 2026/1744, PB L 2026/1744 van 24.7.2026, Nederlandse tekst via het Publicatiebureau (publications.europa.eu, CELEX 32026R1744), overwegingen 1 en 100, artikel 1 (wijziging artikelen 50 en 113) en slotbepaling"
  vastgesteld: 2026-11-11
  houdbaarheid_dagen: 365
  status: actueel
  slides: [GEO-05, SAM-02, GOV-05, GOV-07, OPN-03]
  noot: "Primaire controle van K-GEO-003: data en nummer kloppen. EUR-Lex zelf gaf een botcontrole; de tekst is gelezen via de officiële Cellar-dienst van het Publicatiebureau. Dat transparantieplichten en het toezicht op algemene modellen op 2 augustus 2026 ingingen, volgt uit de oorspronkelijke AI Act (Verordening 2024/1689, artikel 113) en is door de omnibus niet veranderd."
