# ---------- Fase 2, 2026-11-10: bronnen voor sectie GEO ----------

# GEO-05: AI Act
- id: K-GEO-003
  bewering: "De wijziging van de AI Act (Digital Omnibus on AI) is formeel aangenomen: Parlement 16 juni, Raad 29 juni 2026, gepubliceerd als Verordening (EU) 2026/1744 op 24 juli 2026. Hoog-risicoverplichtingen voor losse systemen (Annex III) gelden vanaf 2 december 2027, voor systemen in producten (Annex I) vanaf 2 augustus 2028. Transparantieplichten (art. 50) en het toezicht op algemene modellen gingen in op 2 augustus 2026; een verbod op AI voor niet-consensuele intieme beelden geldt vanaf 2 december 2026."
  peildatum: 2026-07-24
  bron: eu-ai-act
  vindplaats: "Verordening (EU) 2026/1744; Addleshaw Goddard, 'EU AI Act: AI Omnibus formally adopted' (1 juli 2026); Dastra en Mondaq"
  vastgesteld: 2026-11-10
  houdbaarheid_dagen: 180
  status: vervangen
  vervangen_door: K-GEO-010
  slides: [GEO-05, SAM-02]
  noot: "Nummer en publicatiedatum via juridische vakbronnen; EUR-Lex was met de beschikbare middelen niet leesbaar. Voor systemen die al vóór 2 augustus 2026 op de markt waren, geldt voor watermerken een overgangstermijn tot 2 december 2026. AI-geletterdheid is afgezwakt tot een inspanningsverplichting."

