  noot: "Stand op 2026-11-11: van geen van de negen voorspellingen is bij een primaire bron vastgesteld dat hij uitkwam. De OpenAI-pagina 'Empowering cyber defenders' (door Joan met de hand geopend, 2026-11-11) is een beleidsplan met voorstellen aan overheden en industrie, geen product. GPT-6 Cyber (5 nov. 2026, alleen voor geselecteerde klanten) staat alleen in de vakpers; OpenAI bracht al eerder in 2026 cybermodellen uit. Of voorspelling 9 is uitgekomen, laten we aan de scorekaart van de auteurs. De wekelijkse update houdt de stand bij."
